# Netlify deployment config for the Expo web build.
# Build outputs to dist/ (expo export), which is gitignored — Netlify must
# run the build itself; do NOT publish the repo root or upload dist manually.

[build]
  # NativeWind (forceWriteFileSystem) writes node_modules/react-native-css-interop/.cache/web.css
  # during the bundle, but Metro resolves that path before it exists in a fresh CI install.
  # Bootstrap the empty cache file first so the SHA-1 lookup succeeds; the bundle fills it in.
  command = "mkdir -p node_modules/react-native-css-interop/.cache && touch node_modules/react-native-css-interop/.cache/web.css && npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: expo-router handles client-side routing; unknown paths render
# the app shell instead of a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
